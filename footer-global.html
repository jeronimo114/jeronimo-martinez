<script>
(function() {
  var modal = document.getElementById('efContactModal');
  var closeBtn = modal ? modal.querySelector('.ef-modal-close') : null;

  function openModal() {
    if (modal) {
      modal.classList.add('ef-active');
      document.body.style.overflow = 'hidden';
    }
  }

  function closeModal() {
    if (modal) {
      modal.classList.remove('ef-active');
      document.body.style.overflow = '';
    }
  }

  // Botón CONTÁCTANOS del footer
  var contactTriggers = document.querySelectorAll('.ef-contact-trigger');
  contactTriggers.forEach(function(trigger) {
    trigger.addEventListener('click', function(e) {
      e.preventDefault();
      openModal();
    });
  });

  // Cerrar con X
  if (closeBtn) {
    closeBtn.addEventListener('click', closeModal);
  }

  // Cerrar al hacer clic fuera
  if (modal) {
    modal.addEventListener('click', function(e) {
      if (e.target === modal) closeModal();
    });
  }

  // Cerrar con Escape
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && modal && modal.classList.contains('ef-active')) {
      closeModal();
    }
  });
})();
</script>
